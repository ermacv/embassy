[package]
name = "embassy-net"
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Async TCP/IP network stack for embedded systems"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
    "network-programming",
]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "packet-trace", "proto-ipv4", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "multicast", "proto-ipv4", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dns", "medium-ethernet", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "slaac", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "proto-ipv6", "slaac", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ieee802154", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "proto-ipv4", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ip", "proto-ipv4", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "tcp", "udp"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "medium-ip", "proto-ipv4", "proto-ipv6", "tcp", "udp", "raw"]},
    {target = "thumbv7em-none-eabi", features = ["defmt", "dns", "medium-ethernet", "medium-ieee802154", "medium-ip", "proto-ipv4", "proto-ipv6", "tcp", "udp", "packetmeta-id", "packetmeta-timestamp"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-net-v$VERSION/embassy-net/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-net/src/"
features = ["defmt", "tcp", "udp", "raw", "dns", "dhcpv4", "proto-ipv6", "medium-ethernet", "medium-ip", "medium-ieee802154", "multicast", "dhcpv4-hostname", "packetmeta-id"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt", "tcp", "udp", "raw", "dns", "dhcpv4", "proto-ipv6", "medium-ethernet", "medium-ip", "medium-ieee802154", "multicast", "dhcpv4-hostname", "packetmeta-id"]

[features]
default = ["auto-icmp-echo-reply"]

## Enable defmt
defmt = ["dep:defmt", "xarxa/defmt", "embassy-net-driver/defmt", "embassy-time/defmt", "heapless/defmt", "defmt?/ip_in_core"]
## Enable log
log = ["dep:log", "xarxa/log"]

## Trace all raw received and transmitted packets using defmt or log.
packet-trace = ["xarxa/packet-log"]

#! Many of the following feature flags are re-exports of xarxa feature flags. See
#! the [xarxa feature flag documentation](https://github.com/embassy-rs/xarxa#feature-flags)
#! for more details.
#!
#! Socket counts and queue depths are cargo features of `xarxa`, named
#! `<knob>-<N>`. Packet-pool capacity and placement are selected explicitly at
#! runtime by passing a `PacketBufAllocator` to `embassy_net::new`.

## ICMP echo request auto reply
auto-icmp-echo-reply = ["xarxa/icmp-ping-reply"]
## Enable UDP support
udp = ["xarxa/udp"]
## Enable Raw support
raw = ["xarxa/raw"]
## Enable TCP support
tcp = ["xarxa/tcp", "xarxa/tcp-listener"]
## Enable DNS support
dns = ["xarxa/dns"]
## Enable mDNS support
mdns = ["dns", "xarxa/mdns"]
## Enable DHCPv4 support
dhcpv4 = ["proto-ipv4", "medium-ethernet", "xarxa/dhcpv4"]
## Enable DHCPv4 support with hostname
dhcpv4-hostname = ["dhcpv4"]
## Enable IPv4 support
proto-ipv4 = ["xarxa/ipv4", "xarxa/ipv4-fragmentation", "xarxa/ipv4-reassembly"]
## Enable IPv6 support
proto-ipv6 = ["xarxa/ipv6"]
## Enable the Ethernet medium
medium-ethernet = ["xarxa/medium-ethernet"]
## Enable the IP medium
medium-ip = ["xarxa/medium-ip"]
## Enable the IEEE 802.15.4 medium
medium-ieee802154 = ["xarxa/medium-ieee802154"]
## Enable multicast support (for both ipv4 and/or ipv6 if enabled)
multicast = ["xarxa/multicast"]
## Enable stateless address autoconfiguration for ipv6
slaac = ["proto-ipv6", "xarxa/slaac"]
## Enable xarxa std feature
std = ["xarxa/std"]
## Enable xarxa alloc feature
alloc = ["xarxa/alloc"]
## Enable xarxa packetmeta-id feature
packetmeta-id = [ "xarxa/packetmeta-id", "embassy-net-driver/packetmeta-id" ]
## Enable xarxa packetmeta-timestamp feature
packetmeta-timestamp = [ "packetmeta-id", "xarxa/packetmeta-timestamp", "embassy-net-driver/packetmeta-timestamp" ]

[dependencies]

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

xarxa = { git = "https://github.com/ermacv/xarxa.git", rev = "122e97146fc0a174ef3310f4526defc37663bed4", default-features = false, features = ["async"] }

embassy-net-driver = { version = "0.2.0", path = "../embassy-net-driver" }
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embedded-io-async = { version = "0.7.0" }

heapless = { version = "0.9", default-features = false }
embedded-nal-async = "0.9.0"
document-features = "0.2.7"

[dev-dependencies]
embassy-time = { path = "../embassy-time", features = ["generic-queue-8", "std"] }
