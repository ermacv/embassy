[package]
name = "embassy-net-driver"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Driver trait for the `embassy-net` async TCP/IP network stack."
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-net-driver"
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-net-driver-v$VERSION/embassy-net-driver/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-net-driver/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt"]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = ["defmt", "packetmeta-id"]},
]

[dependencies]
defmt = { version = "1.0.1", optional = true }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "f42f16aef73572cc834a6f0298fd275def607bcc", features = ["async"] }

[features]
defmt = ["dep:defmt", "xarxa-driver/defmt"]
## Enable the `PacketMeta::id` field.
packetmeta-id = ["xarxa-driver/packetmeta-id"]
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and `Driver::poll_tx_timestamp`.
packetmeta-timestamp = ["packetmeta-id", "xarxa-driver/packetmeta-timestamp"]

#! Minimum alignment of packet buffers. A driver whose DMA engine needs aligned
#! buffers (and a buffer size that is a multiple of its bus width) enables the
#! feature matching its requirement. The largest one enabled wins.
## Align packet buffers to 2 bytes.
packet-buf-align-2 = ["xarxa-driver/packet-buf-align-2"]
## Align packet buffers to 4 bytes.
packet-buf-align-4 = ["xarxa-driver/packet-buf-align-4"]
## Align packet buffers to 8 bytes.
packet-buf-align-8 = ["xarxa-driver/packet-buf-align-8"]
## Align packet buffers to 16 bytes.
packet-buf-align-16 = ["xarxa-driver/packet-buf-align-16"]
## Align packet buffers to 32 bytes.
packet-buf-align-32 = ["xarxa-driver/packet-buf-align-32"]
